# A one-node local cluster:  kind create cluster --config kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: serviceops
nodes:
  - role: control-plane
    extraPortMappings:
      # The frontend's NodePort, on http://127.0.0.1:8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
