name: ci
on: [push, pull_request]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    # Build each image once, lint it, run the whole stack from it in compose,
    # and push it to GitHub Container Registry when the commit is on main.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: name the images after this commit
        id: names
        run: |
          tag=$(git rev-parse --short=7 HEAD)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_TAG=$tag"
            echo "BACKEND_IMAGE=$REGISTRY/serviceops-backend:$tag"
            echo "FRONTEND_IMAGE=$REGISTRY/serviceops-frontend:$tag"
            echo "APP_REVISION=$(git -C app rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: lint the Dockerfiles
        run: |
          docker build --check -f docker/backend.Dockerfile app/backend
          docker build --check -f docker/frontend.Dockerfile app/frontend

      - name: build the images
        run: |
          for part in backend frontend; do
            image_var="${part^^}_IMAGE"
            docker build -f "docker/$part.Dockerfile" -t "${!image_var}" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "serviceops.app-revision=$APP_REVISION" \
              "app/$part"
          done
          docker image ls --filter "reference=$REGISTRY/*"

      - name: start the stack from those images
        run: docker compose up --no-build --wait --wait-timeout 180

      - name: smoke test through the frontend
        run: python3 scripts/smoke.py http://127.0.0.1:3000

      - name: check Prometheus and the Grafana dashboard
        run: python3 scripts/check_monitoring.py

      - name: show the logs
        if: failure()
        run: docker compose logs --no-color

      - name: save the images for the Kubernetes job
        run: docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | gzip -1 > images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

      - name: push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

  kubernetes:
    # Deploy the same images to a throwaway kind cluster with the real
    # manifests and the real deploy script, then smoke-test through the NodePort.
    needs: images
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.images.outputs.tag }}
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: images

      - name: load the images
        run: gunzip -c images.tar.gz | docker load

      - name: create a kind cluster
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --config kind/cluster.yaml --wait 120s
          kubectl version
          kind load docker-image --name serviceops             "$REGISTRY/serviceops-backend:$TAG" "$REGISTRY/serviceops-frontend:$TAG"

      - name: deploy the release
        run: scripts/deploy.sh "$TAG"

      - name: smoke test through the NodePort
        run: python3 scripts/smoke.py http://127.0.0.1:8080

      - name: a bad release is refused and rolled back, and users don't notice
        run: |
          # Release "bad": the backend crashes on startup; the frontend is unchanged.
          docker build -f test/bad-release.Dockerfile             --build-arg BASE="$REGISTRY/serviceops-backend:$TAG"             -t "$REGISTRY/serviceops-backend:bad" test
          docker tag "$REGISTRY/serviceops-frontend:$TAG" "$REGISTRY/serviceops-frontend:bad"
          kind load docker-image --name serviceops             "$REGISTRY/serviceops-backend:bad" "$REGISTRY/serviceops-frontend:bad"

          python3 scripts/watch.py http://127.0.0.1:8080/api/ready > watch.log 2>&1 &
          watcher=$!

          if TIMEOUT=60s scripts/deploy.sh bad; then
            echo "::error::the bad release was accepted"
            exit 1
          fi

          kill -TERM "$watcher"
          watch_ok=0
          wait "$watcher" || watch_ok=$?
          cat watch.log

          for d in backend frontend; do
            image=$(kubectl -n serviceops get deployment "$d" -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "$d is on $image"
            [ "$image" = "$REGISTRY/serviceops-$d:$TAG" ] || { echo "::error::$d wasn't rolled back"; exit 1; }
          done
          kubectl -n serviceops rollout history deployment/backend
          if [ "$watch_ok" != 0 ]; then
            echo "::error::requests failed while the bad release was rolled back"
            exit 1
          fi

      - name: smoke test again after the rollback
        run: python3 scripts/smoke.py http://127.0.0.1:8080

      - name: show what the cluster saw
        if: failure()
        run: |
          kubectl -n serviceops get all,pvc
          kubectl -n serviceops get events --sort-by=.lastTimestamp | tail -40
          kubectl -n serviceops logs -l app=backend --all-containers --tail=60 --prefix || true
          kubectl -n serviceops logs -l app=frontend --tail=30 --prefix || true
